<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b1310">
    <title>Reset password — Themba</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700&family=Newsreader:ital,wght@0,400;0,500;1,400&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="../styles/theme.css">
    <link rel="stylesheet" href="../styles/auth.css">
</head>

<body data-page="reset">
    <main class="auth">

        <section class="auth-hero">
            <a class="brand" href="login.html" aria-label="Themba home">
                <span class="brand-coin" aria-hidden="true">T</span>
                <span class="brand-text">
                    <span class="brand-name">THEMBA</span>
                    <span class="brand-tag">Transparent Wealth</span>
                </span>
            </a>
            <a class="back-link" href="login.html">&larr; Back to sign in</a>
            <div class="hero-copy">
                <span class="eyebrow">Account recovery</span>
                <h1 class="hero-title">Back in<br><em>in a moment.</em></h1>
                <p class="hero-sub">Choose a new password for your Themba account.</p>
            </div>
        </section>

        <section class="auth-panel">
            <div class="auth-card">
                <span class="eyebrow">Reset password</span>
                <h2 class="auth-title" id="rp-title">Checking your reset link…</h2>
                <p class="auth-lede" id="rp-lede">One moment.</p>

                <form id="rp-form" novalidate hidden>
                    <div class="field">
                        <label for="rp-pass">New password</label>
                        <input class="input" id="rp-pass" type="password" autocomplete="new-password" minlength="8"
                            required>
                        <p class="field-error" role="alert"></p>
                    </div>
                    <div class="field">
                        <label for="rp-confirm">Confirm new password</label>
                        <input class="input" id="rp-confirm" type="password" autocomplete="new-password" minlength="8"
                            required>
                        <p class="field-error" role="alert"></p>
                    </div>
                    <button class="btn btn-gold" type="submit" id="rp-submit"><span class="btn-label">Update
                            password</span></button>
                </form>

                <p class="auth-switch" id="rp-back" hidden><a href="login.html">Back to sign in</a></p>
            </div>
        </section>
    </main>

    <div class="toast-stack" id="toasts" aria-live="polite"></div>
    <script src="../scripts/config.js"></script>
    <script src="../scripts/supabase.js"></script>
    <script src="../scripts/supabase-client.js"></script>
    <script>
        (() => {
            "use strict";
            const $ = (s) => document.querySelector(s);
            const sb = window.ThembaSupabase;
            const title = $("#rp-title"), lede = $("#rp-lede"), form = $("#rp-form"), back = $("#rp-back");
            const pass = $("#rp-pass"), confirm = $("#rp-confirm"), submit = $("#rp-submit");

            function fieldError(input, msg) {   // the theme only shows .field-error when the field has the "has-error" class
                const f = input.closest(".field"); f.classList.toggle("has-error", !!msg);
                f.querySelector(".field-error").textContent = msg || "";
                input.setAttribute("aria-invalid", msg ? "true" : "false");
                if (msg) toast(msg, "error");
            }
            function toast(msg, type) {
                const st = $("#toasts"), t = document.createElement("div"); t.className = "toast " + (type || "info"); t.textContent = msg; st.append(t);
                setTimeout(() => t.remove(), 5200);
            }
            function showForm() {
                if (!form.hidden) return;
                title.textContent = "Choose a new password"; lede.textContent = "Use at least 8 characters.";
                form.hidden = false; back.hidden = true; pass.focus();
            }
            function showProblem(msg) {
                title.textContent = "This reset link can't be used"; lede.textContent = msg;
                form.hidden = true; back.hidden = false;
            }

            if (!sb) { showProblem("The live database is not connected, so passwords can't be reset here. Check that scripts/config.js and scripts/supabase.js are being served."); return; }

            // Supabase puts a failed link in the URL (e.g. #error_code=otp_expired). Show it plainly.
            const urlParams = new URLSearchParams(location.hash.replace(/^#/, "") + "&" + location.search.replace(/^\?/, ""));
            if (urlParams.get("error")) { showProblem("The link has expired or was already used. Go back to sign in and request a new one."); return; }

            // Supabase reads the recovery token from the URL and fires PASSWORD_RECOVERY (it also signs the user in).
            sb.auth.onAuthStateChange((evt) => { if (evt === "PASSWORD_RECOVERY") showForm(); });
            setTimeout(async () => {   // fallback: the event may have fired before we subscribed
                if (!form.hidden) return;
                const { data: { session } } = await sb.auth.getSession();
                if (session) showForm(); else showProblem("Open this page from the link in your reset email. If it still fails, request a new link from the sign-in page.");
            }, 1500);

            form.addEventListener("submit", async (e) => {
                e.preventDefault();
                fieldError(pass); fieldError(confirm);
                if (pass.value.length < 8) { fieldError(pass, "Use at least 8 characters."); pass.focus(); return; }
                if (pass.value !== confirm.value) { fieldError(confirm, "The passwords don't match."); confirm.focus(); return; }
                submit.disabled = true;
                let error = null;
                try {
                    const res = await Promise.race([
                        sb.auth.updateUser({ password: pass.value }),
                        new Promise((_, rej) => setTimeout(() => rej(new Error("The request timed out. Request a new reset link and try again.")), 15000))
                    ]);
                    error = res.error;
                } catch (err) { error = err; }
                if (error) { submit.disabled = false; fieldError(pass, error.message); return; }
                toast("Password updated. Please sign in with your new password.", "success");
                await sb.auth.signOut();
                try { localStorage.removeItem("themba_session"); sessionStorage.removeItem("themba_session"); } catch (err) { /* ignore */ }
                setTimeout(() => { location.href = "login.html"; }, 1800);
            });
        })();
    </script>
</body>

</html>
